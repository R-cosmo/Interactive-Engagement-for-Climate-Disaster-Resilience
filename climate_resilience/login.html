<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Climate and Disaster Resilience</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>Climate Engage AU</h1>

    <nav>
        <a href="home.html">Home</a> |
        <a href="login.html">Login</a> |
        <a href="event.html">Events</a> |
        <a href="blog.html">Blog</a> |
        <a href="resources.html">Resources</a> |
        <a href="contribute.html">Contribute</a> |
        <a href="pestle.html">PESTLE</a> |
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Login</h2>
      <p>Please enter your username and password.</p>

    <form action="login.php" method="post">
    <label>Username:</label><br>
    <input type="text" name="username" required><br><br>

        <label for="password">Password:</label><br />
        <input type="password" id="password" name="password" required /><br /><br />

        <button type="submit">Login</button>
        <a href="register.html" class="btn-register">Register</a>
      </form>

      <p>Admin login will redirect to admin page later.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Climate and Disaster Resilience. All rights reserved.</p>
  </footer>

  <script>
    document.querySelector("form").addEventListener("submit", async function (event) {
      event.preventDefault();

      const username = document.querySelector('input[name="username"]').value.trim();
      const password = document.querySelector('input[name="password"]').value.trim();

      // Call login API
      const response = await fetch("http://localhost:8080/login_api.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
      });

      const data = await response.json();

      if (data.success) {
          // Redirect based on role
          if (data.role === "admin") {
            alert("Login successful! Redirecting to admin page.")
            window.location.href = "admin.php";
          } else {
            alert("Login successful! Redirecting to home page.")
            window.location.href = "home.html";
          }
      } else {
          alert("Login failed: " + (data.error || "Invalid username or password"));
      }
    });
  </script>
</body>
</html>
