<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Climate and Disaster Resilience</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ---------- Subscribe Page Layout ---------- */
    main section {
     max-width: 400px;
      margin: 60px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(20, 83, 45, 0.08);
      text-align: center;
    }

    main section h2 {
      margin-bottom: 10px;
      color: #0f5132;
    }

    main section p {
      margin-bottom: 20px;
      color: #333;
    }

    main section input[type="email"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    main section button {
      background: #198754;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      margin: 5px;
    }

    main section button:hover {
      background: #14532d;
    }

    /* ---------- Footer ---------- */
    footer {
      text-align: center;
      padding: 20px;
      background: #0f5132;
      color: white;
      margin-top: 40px;
      border-top: 4px solid #198754;
    }
    </style>
</head>

<body>
  <header>
    <h1>Climate Engage AU</h1>

    <nav>
        | <a href="home.html">Home</a> |
        <a href="event.html">Events</a> |
        <a href="blog.html">Blog</a> |
        <a href="resources.html">Resources</a> |
        <a href="regions.html">Regions</a> |
        <a href="contribute.html">Contribute</a> |
        <a href="pestle.html">PESTLE</a> |
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a> |
        <a href="subscribe.html">Subscribe</a> |
    </nav>
  </header>

  <main>
    <section>
      <h2>Subscribe</h2>
      <p>Stay updated with the latest climate and resilience news.</p>

      <form id="subscribeForm">
        <label for="email">Email:</label><br />
        <input type="email" id="email" name="email" placeholder="Enter your email" required /><br /><br />

        <button type="submit">Subscribe</button>
        <button type="button" onclick="window.location.href='home.html'">Back to Home</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Climate and Disaster Resilience. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById("subscribeForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();

      if (email) {
        alert("You are subscribed!");
        window.location.href = "home.html";   // redirect to home
        document.getElementById("subscribeForm").reset();
      } else {
        alert("Please enter a valid email address.");
      }
    });
  </script>
</body>
</html>
