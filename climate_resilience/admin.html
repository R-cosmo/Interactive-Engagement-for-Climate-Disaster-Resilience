<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Climate Engage AU</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-panel {
      display: grid;
      gap: 24px;
    }

    .admin-form {
      max-width: 820px;
    }

    .admin-form textarea {
      min-height: 180px;
    }

    .status-message {
      margin-top: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <script>
    if (localStorage.getItem("role") !== "admin") {
      alert("Admin access only.");
      window.location.href = "login.html";
    }
  </script>

  <header>
    <h1>Climate Engage AU</h1>
    <nav>
      | <a href="admin.html">Admin Dashboard</a> |
      <a href="home.html">Home</a> |
      <a href="blog.html">Blog</a> |
      <a href="logout.html">Logout</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Admin Panel</h2>
      <p id="adminGreeting">Only admins can see this page.</p>
    </section>

    <section class="admin-panel">
      <div>
        <h2>Create Blog Post</h2>
        <p>Create a new blog post and save it to the MongoDB blogs collection.</p>
      </div>

      <form id="blogForm" class="admin-form" action="#" method="post">
        <label for="blogTitle">Title *</label>
        <input type="text" id="blogTitle" name="title" required />

        <label for="blogSummary">Summary *</label>
        <textarea id="blogSummary" name="summary" rows="4" required></textarea>

        <label for="blogContent">Content *</label>
        <textarea id="blogContent" name="content" rows="10" required></textarea>

        <label for="blogAuthor">Author *</label>
        <input type="text" id="blogAuthor" name="author" required />

        <label for="blogCategory">Category *</label>
        <select id="blogCategory" name="category" required>
          <option value="">Select a category</option>
          <option value="Climate Action">Climate Action</option>
          <option value="Disaster Resilience">Disaster Resilience</option>
          <option value="Sustainability">Sustainability</option>
          <option value="Community">Community</option>
          <option value="Research and Policy">Research and Policy</option>
        </select>

        <label for="blogTags">Tags</label>
        <input type="text" id="blogTags" name="tags" placeholder="resilience, climate risk, community" />

        <label for="blogStatus">Status</label>
        <select id="blogStatus" name="status">
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>

        <button type="submit">Create Blog</button>
        <p id="blogMessage" class="status-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Climate Engage AU. All rights reserved.</p>
  </footer>

  <script>
    const username = localStorage.getItem("username") || "Admin";
    const blogForm = document.getElementById("blogForm");
    const blogMessage = document.getElementById("blogMessage");

    document.getElementById("adminGreeting").textContent = "Welcome, " + username + ".";
    document.getElementById("blogAuthor").value = username;

    blogForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const payload = {
        title: document.getElementById("blogTitle").value.trim(),
        summary: document.getElementById("blogSummary").value.trim(),
        content: document.getElementById("blogContent").value.trim(),
        author: document.getElementById("blogAuthor").value.trim(),
        category: document.getElementById("blogCategory").value,
        tags: document.getElementById("blogTags").value.trim(),
        status: document.getElementById("blogStatus").value
      };

      if (!payload.title || !payload.summary || !payload.content || !payload.author || !payload.category) {
        blogMessage.textContent = "Please complete all required fields.";
        blogMessage.style.color = "#842029";
        return;
      }

      blogMessage.textContent = "Creating blog post...";
      blogMessage.style.color = "#244032";

      try {
        const response = await fetch("https://interactive-engagement-for-climate.onrender.com/blog.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Blog creation failed");
        }

        blogMessage.textContent = "Blog post created successfully.";
        blogMessage.style.color = "#0f5132";
        blogForm.reset();
        document.getElementById("blogAuthor").value = username;
      } catch (error) {
        blogMessage.textContent = error.message || "Blog creation failed. Please try again later.";
        blogMessage.style.color = "#842029";
      }
    });
  </script>
</body>
</html>
