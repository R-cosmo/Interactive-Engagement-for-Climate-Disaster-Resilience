<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Detail | Climate Engage AU</title>
  </head>
  <body>
    <header>
      <h1>Climate Engage AU</h1>

      <nav>
        | <a href="home.html">Home</a> |
        <a href="event.html">Events</a> |
        <a href="blog.html">Blog</a> |
        <a href="resources.html">Resources</a> |
        <a href="regions.html">Regions</a> |
        <a href="contribute.html">Contribute</a> |
        <a href="pestle.html">PESTLE</a> |
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a> |

        <span id="loginWrapper">
          <a href="login.html">Login</a> |
        </span>

        <span id="welcomeWrapper">
          <strong id="welcomeText">Welcome, Guest</strong> |
        </span>

        <span id="adminGo">
          <a href="admin.html" id="adminLink">Admin</a> |
        </span>

        <span id="logoutWrapper">
          <a href="logout.html" id="logoutLink">Logout</a>
        </span>
      </nav>
    </header>

    <main>
      <section>
        <a href="blog.html">&larr; Back to Blog</a>
        <article id="blogDetail">
          <p>Loading blog post...</p>
        </article>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Climate Engage AU. All rights reserved.</p>
    </footer>

    <script>
      const username = localStorage.getItem("username");
      const role = localStorage.getItem("role");

      const loginWrapper = document.getElementById("loginWrapper");
      const welcomeWrapper = document.getElementById("welcomeWrapper");
      const logoutWrapper = document.getElementById("logoutWrapper");
      const welcomeText = document.getElementById("welcomeText");
      const adminGo = document.getElementById("adminGo");

      if (username) {
        welcomeText.textContent = "Welcome, " + username;
        loginWrapper.style.display = "none";
        welcomeWrapper.style.display = "inline";
        logoutWrapper.style.display = "inline";
      } else {
        welcomeText.textContent = "Welcome, Guest";
        loginWrapper.style.display = "inline";
        welcomeWrapper.style.display = "inline";
        logoutWrapper.style.display = "none";
      }

      adminGo.style.display = role === "admin" ? "inline" : "none";

      const params = new URLSearchParams(window.location.search);
      const blogId = params.get("id");
      const blogDetail = document.getElementById("blogDetail");

      function formatDate(value) {
        if (!value) {
          return "";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "";
        }

        return date.toLocaleDateString();
      }

      function renderBlog(blog) {
        blogDetail.textContent = "";
        document.title = blog.title + " | Climate Engage AU";

        const title = document.createElement("h2");
        title.textContent = blog.title;
        blogDetail.appendChild(title);

        const summary = document.createElement("p");
        summary.textContent = blog.summary;
        blogDetail.appendChild(summary);

        const meta = document.createElement("p");
        const tags = Array.isArray(blog.tags) && blog.tags.length ? " | Tags: " + blog.tags.join(", ") : "";
        meta.textContent = "Author: " + blog.author + " | Category: " + blog.category + tags + " | Published: " + formatDate(blog.created_at);
        blogDetail.appendChild(meta);

        const content = document.createElement("p");
        content.textContent = blog.content;
        blogDetail.appendChild(content);
      }

      async function loadBlog() {
        if (!blogId) {
          blogDetail.innerHTML = "<p>Blog post not found.</p>";
          return;
        }

        try {
          const response = await fetch("https://interactive-engagement-for-climate.onrender.com/blog.php");
          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.error || "Could not load blog post");
          }

          const blog = (data.blogs || []).find((item) => item.id === blogId);
          if (!blog) {
            blogDetail.innerHTML = "<p>Blog post not found.</p>";
            return;
          }

          renderBlog(blog);
        } catch (error) {
          blogDetail.textContent = "";
          const errorMessage = document.createElement("p");
          errorMessage.textContent = error.message || "Could not load blog post.";
          blogDetail.appendChild(errorMessage);
        }
      }

      loadBlog();
    </script>
  </body>
</html>
